
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESERVA DE BIBLIOTECA</title>
  <style>
    :root {
      --col-date-width: 110px;
      --col-session-width: 90px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #f5f5f5;
    }

    header {
      background: #fbc02d; /* Amarillo biblioteca */
      color: white;
      padding: 16px 24px 10px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 24px 6px;
      background: #f5f5f5;
    }

    main {
      padding: 12px 16px 24px;
    }

    label {
      font-weight: 600;
    }

    select {
      padding: 4px 8px;
      font-size: 14px;
    }

    .legend {
      font-size: 12px;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid #aaa;
    }

    .legend-color.free {
      background: #ffffff;
    }

    .legend-color.reserved {
      background: #e53935;
    }

    .table-container {
      max-width: 100%;
      overflow: auto;         /* Scroll horizontal y vertical aquí */
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      max-height: 80vh;       /* para poder centrar el día actual */
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      font-size: 12px;
      table-layout: fixed;
    }

    /* Bordes y fondo por defecto de TODAS las celdas */
    th,
    td {
      border: 1px solid #ccc;
      padding: 4px 6px;
      text-align: center;
      white-space: normal;
      word-break: break-word;
      background: #ffffff; /* Libre en blanco por defecto */
    }

    thead {
      background: #e1e9f2;
    }

    /* Cabecera fija arriba (todas las columnas) */
    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #dde3ff;  /* Color distinto para la cabecera */
    }

    /* Ancho fijo para columnas Fecha y Sesión */
    thead th:nth-child(1),
    tbody td:nth-child(1) {
      width: var(--col-date-width);
      min-width: var(--col-date-width);
      max-width: var(--col-date-width);
    }

    thead th:nth-child(2),
    tbody td:nth-child(2) {
      width: var(--col-session-width);
      min-width: var(--col-session-width);
      max-width: var(--col-session-width);
    }

    /* Primera columna (Fecha) fija a la izquierda */
    thead th:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 20;          /* más alto para superponerse bien */
      background: #dde3ff;
    }

    /* Segunda columna (Sesión) fija a la izquierda detrás de la de Fecha */
    thead th:nth-child(2) {
      position: sticky;
      left: var(--col-date-width);
      z-index: 20;
      background: #dde3ff;
    }

    /* Celdas de cuerpo: Fecha y Sesión fijas a la izquierda al hacer scroll horizontal */
    tbody td:nth-child(1) {
      position: sticky;
      left: 0;
      z-index: 15;
      background: #fff;
    }

    tbody td:nth-child(2) {
      position: sticky;
      left: var(--col-date-width);
      z-index: 15;
      background: #fff;
    }

    /* Separador grueso entre días (primera fila de cada día) */
    tbody tr.first-slot-of-day td {
      border-top-width: 3px;
    }

    /* Fila con alguna reserva (fondo rojo clarito) */
    tbody tr.row-has-reservation td {
      background: #ffebee;
    }

    td.reservable {
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    td.reservable:hover {
      box-shadow: inset 0 0 0 2px #1f4e79;
    }

    td.reserved {
      background: #e53935 !important;
      color: #ffffff;
      font-weight: 700;
    }

    /* Reservas fijas por clase (no clicables) */
    td.fixed-reserved {
      background: #b71c1c !important;
      color: #ffffff;
      font-weight: 700;
      cursor: default;
    }

    /* Franja bloqueada globalmente (Préstamos / No disponible) */
    td.global-blocked {
      background: #ffebee !important;
      color: #b71c1c;
      font-weight: 600;
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    td.reservable::before,
    td.global-blocked::before {
      content: attr(data-class);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: rgba(0, 0, 0, 0.25);
      pointer-events: none;
      text-align: center;
      width: 100%;
      padding: 0 4px;
      box-sizing: border-box;
      line-height: 1.2;
    }

    td.reserved::before {
      color: rgba(255, 255, 255, 0.6);
    }

    td.fixed-reserved::before {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Celda de fecha del día actual (marcado en verde) */
    .today-date-cell {
      background: #c8e6c9 !important;
      border-left: 8px solid #2e7d32;
      font-weight: 700;
    }

    .info {
      font-size: 11px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <!-- Barra superior fija -->
  <div class="top-bar">
    <header>
      <h1>RESERVA DE BIBLIOTECA · CURSO 2026–2027</h1>
    </header>

    <div class="controls">
      <div>
        <label for="monthSelect">Mes:</label>
        <select id="monthSelect"></select>
      </div>
      <div class="legend">
        <span class="legend-item">
          <span class="legend-color free"></span> Libre
        </span>
        <span class="legend-item">
          <span class="legend-color reserved"></span> Reservado
        </span>
        <span>Haz doble clic o doble toque para reservar / liberar.</span>
      </div>
    </div>
  </div>

  <main>
    <div class="table-container">
      <table id="calendarTable">
        <!-- Cabecera y cuerpo se generan por JS -->
      </table>
    </div>

    <p class="info">
      * Las reservas pueden cambiarse o cancelarse durante un máximo de 2 minutos desde el momento en que se realizan.
    </p>
    <p class="info">

    </p>
  </main>

  <!-- JS con Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      deleteField
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ⏱ TIEMPO MÁXIMO PARA DESHACER (ms) → ahora 2 minutos
    const UNRESERVE_WINDOW_MS = 2 * 60 * 1000;

    // ⏱ TIEMPO MÁXIMO DE BLOQUEO POR DISPOSITIVO (24h)
    const USER_RESERVATION_TTL_MS = 24 * 60 * 60 * 1000;

    const firebaseConfig = {
      apiKey: "AIzaSyD5EAMg-0p54f8bPq8SVdZ_ePg5Xso3cmg",
      authDomain: "arm1-acbba.firebaseapp.com",
      projectId: "arm1-acbba",
      storageBucket: "arm1-acbba.firebasestorage.app",
      messagingSenderId: "408825932019",
      appId: "1:408825932019:web:10f2079b590b4c9ca3af86",
      measurementId: "G-S78TM6PVRL"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const months = [
      { year: 2026, month: 9, name: "Septiembre 2026" },
      { year: 2026, month: 10, name: "Octubre 2026" },
      { year: 2026, month: 11, name: "Noviembre 2026" },
      { year: 2026, month: 12, name: "Diciembre 2026" },
      { year: 2027, month: 1, name: "Enero 2027" },
      { year: 2027, month: 2, name: "Febrero 2027" },
      { year: 2027, month: 3, name: "Marzo 2027" },
      { year: 2027, month: 4, name: "Abril 2027" },
      { year: 2027, month: 5, name: "Mayo 2027" },
      { year: 2027, month: 6, name: "Junio 2027" }
    ];

    const classes = [
      "Infantil 3 años",
      "Infantil 4 años",
      "Infantil 5 años",
      "1ºA",
      "2ºA",
      "3ºA",
      "4ºA",
      "4ºB",
      "5ºA",
      "5ºB",
      "6ºA",
      "6ºB"
    ];

    // Horarios normales (octubre–mayo)
    const defaultSlots = [
      "9:00-9:45",   // 1ª
      "9:45-10:30",  // 2ª
      "10:30-11:15", // 3ª
      "11:45-12:30", // 4ª
      "12:30-13:15", // 5ª
      "13:15-14:00"  // 6ª
    ];

    // Horarios especiales para SEPTIEMBRE 2026 y JUNIO 2027 (solo 5 sesiones)
    const juneSlots = [
      "9:00-9:40",
      "9:40-10:20",
      "10:20-11:00",
      "11:30-12:15",
      "12:15-13:00"
    ];

    function getSlotsForMonth(monthIndex) {
      const { year, month } = months[monthIndex];

      // Septiembre 2026 y junio 2027 tienen horario reducido de 5 sesiones
      if ((year === 2026 && month === 9) || (year === 2027 && month === 6)) {
        return juneSlots;
      }

      // Octubre 2026 a mayo 2027 mantienen el horario habitual
      return defaultSlots;
    }

    /* === RESERVAS FIJAS BIBLIOTECA ===
       Curso 2026–2027: todavía no hay ninguna franja asignada de forma fija.
    */
    const FIXED_WEEKLY_RESERVATIONS = [];

    // Curso 2026–2027: de momento no hay franjas bloqueadas globalmente.
    function getGlobalBlockedLabel(dateIso, slot) {
      return null;
    }

    function isFixedReservation(dateIso, slot, className) {
      const d = new Date(dateIso);
      const weekday = d.getDay(); // 0=Dom,1=Lun,…,5=Vie
      if (weekday < 1 || weekday > 5) return false;

      const slotsForMonth = getSlotsForMonth(currentMonthIndex);
      const idx = slotsForMonth.indexOf(slot);
      if (idx === -1) return false;
      const session = idx + 1;

      return FIXED_WEEKLY_RESERVATIONS.some(
        r => r.weekday === weekday && r.session === session && r.className === className
      );
    }

    // Devuelve si una franja (fecha+slot) está ocupada por una reserva fija global, aunque sea otra clase
    function getFixedReservationForSlot(dateIso, slot) {
      const d = new Date(dateIso);
      const weekday = d.getDay();
      if (weekday < 1 || weekday > 5) return null;

      // Primero, si es franja bloqueada global (Préstamos / No disponible)
      const globalLabel = getGlobalBlockedLabel(dateIso, slot);
      if (globalLabel) {
        return {
          id: null,
          className: globalLabel,
          value: "global-blocked"
        };
      }

      const slotsForMonth = getSlotsForMonth(currentMonthIndex);
      const idx = slotsForMonth.indexOf(slot);
      if (idx === -1) return null;
      const session = idx + 1;

      const r = FIXED_WEEKLY_RESERVATIONS.find(
        x => x.weekday === weekday && x.session === session
      );
      return r || null;
    }

    const monthSelect    = document.getElementById("monthSelect");
    const calendarTable  = document.getElementById("calendarTable");
    const tableContainer = document.querySelector(".table-container");

    let currentMonthIndex = 0;
    let currentData = {};
    let unsubscribe = null;

    // Para que solo auto-centre el mes de "hoy" la primera vez
    const autoScrolledMonths = {};

    function getCurrentDocId() {
      const { year, month } = months[currentMonthIndex];
      return `${year}-${String(month).padStart(2, "0")}`;
    }

    function monthDocRef(monthIndex) {
      const { year, month } = months[monthIndex];
      const id = `${year}-${String(month).padStart(2, "0")}`;
      // Colección específica para la biblioteca
      return doc(db, "reservas_biblioteca_celdas", id);
    }

    function buildReservationId(dateIso, slot, className) {
      return `${dateIso}__${slot}__${className}`;
    }

    function subscribeToMonth(monthIndex) {
      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }
      currentMonthIndex = monthIndex;

      const ref = monthDocRef(monthIndex);
      unsubscribe = onSnapshot(ref, (snap) => {
        currentData = snap.exists() ? snap.data() : {};
        renderMonth(monthIndex);
      });
    }

    async function setReservationValue(id, value) {
      const ref = monthDocRef(currentMonthIndex);
      const update = {};
      update[id] = value;
      await setDoc(ref, update, { merge: true });
    }

    async function clearReservation(id) {
      const ref = monthDocRef(currentMonthIndex);
      const update = {};
      update[id] = deleteField();
      await setDoc(ref, update, { merge: true });
    }

    // ➜ CONTROL POR USUARIO:
    // Máx. 1 reserva POR SEMANA (semana ISO) en las últimas 24h
    // Se guardan en localStorage por semana: { "2025-W45": { fullId, time }, ... }
    // Usamos otra clave distinta para NO mezclar con la de portátiles / informática.
    const LOCAL_USER_RES_KEY = "reservas_biblioteca_mis_reservas_por_semana";

    // Calcula la semana ISO (año-semana) a partir de una fecha YYYY-MM-DD
    function getWeekKeyFromIso(dateIso) {
      const [year, month, day] = dateIso.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      const { isoYear, week } = getISOYearWeek(date);
      return `${isoYear}-W${String(week).padStart(2, "0")}`;
    }

    // Devuelve { isoYear, week } usando semanas ISO (lunes-domingo)
    function getISOYearWeek(date) {
      const tmp = new Date(date.valueOf());
      // Día de la semana con lunes = 0
      const dayNr = (tmp.getDay() + 6) % 7;
      // Colocamos la fecha en el jueves de esa semana
      tmp.setDate(tmp.getDate() - dayNr + 3);

      const isoYear = tmp.getFullYear();

      // Jueves de la primera semana del año ISO
      const jan4 = new Date(isoYear, 0, 4);
      const jan4Day = (jan4.getDay() + 6) % 7;
      jan4.setDate(jan4.getDate() - jan4Day + 3);

      const week = 1 + Math.round((tmp - jan4) / 604800000); // 604800000 = ms en una semana
      return { isoYear, week };
    }

    // Lee el mapa de reservas por semana del usuario desde localStorage
    function getUserReservationsMap() {
      try {
        const raw = localStorage.getItem(LOCAL_USER_RES_KEY);
        if (!raw) return {};
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) return {};
        return obj;
      } catch {
        return {};
      }
    }

    // Guarda el mapa de reservas por semana
    function saveUserReservationsMap(map) {
      try {
        localStorage.setItem(LOCAL_USER_RES_KEY, JSON.stringify(map));
      } catch {
        // si falla localStorage, no pasa nada
      }
    }

    // Devuelve la reserva (si existe y no ha caducado) para una semana concreta
    function getUserReservationInfoForWeek(weekKey) {
      const map = getUserReservationsMap();
      const now = Date.now();
      let changed = false;

      // Limpiamos reservas caducadas (> 24h)
      for (const wk in map) {
        const info = map[wk];
        if (!info || typeof info.time !== "number") {
          delete map[wk];
          changed = true;
          continue;
        }
        if (now - info.time > USER_RESERVATION_TTL_MS) {
          delete map[wk];
          changed = true;
        }
      }

      if (changed) {
        saveUserReservationsMap(map);
      }

      return map[weekKey] || null;
    }

    // Añade/actualiza la reserva de una semana
    function addUserReservationForWeek(weekKey, fullId, time) {
      const map = getUserReservationsMap();
      map[weekKey] = { fullId, time };
      saveUserReservationsMap(map);
    }

    // Elimina del mapa cualquier reserva que tenga ese fullId
    function removeUserReservationByFullId(fullId) {
      const map = getUserReservationsMap();
      let changed = false;
      for (const wk in map) {
        if (map[wk] && map[wk].fullId === fullId) {
          delete map[wk];
          changed = true;
        }
      }
      if (changed) {
        saveUserReservationsMap(map);
      }
    }

    function buildFullReservationId(id) {
      const docId = getCurrentDocId();
      return `${docId}::${id}`;
    }

    // Devuelve la reserva (si existe) para una fecha + franja, sin importar la clase
    function getExistingReservationForSlot(dateIso, slot) {
      const prefix = `${dateIso}__${slot}__`;

      for (const key in currentData) {
        const value = currentData[key];
        if (!value) continue; // sin reserva

        if (typeof value === "number" || value === true) {
          if (key.startsWith(prefix)) {
            const parts = key.split("__");
            const cls   = parts[2] || "";
            return {
              id: key,
              className: cls,
              value
            };
          }
        }
      }

      // Si no hay en Firestore, miramos si la franja está ocupada por una reserva fija
      const fixed = getFixedReservationForSlot(dateIso, slot);
      if (fixed) {
        return {
          id: null,
          className: fixed.className,
          value: fixed.value || "fixed"
        };
      }

      return null;
    }

    // Devuelve la fecha de hoy en formato YYYY-MM-DD
    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    // ➜ NUEVA FUNCIÓN: calcula qué índice del array "months" corresponde al mes actual
    function getInitialMonthIndex() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1; // 1–12

      const idx = months.findIndex(m => m.year === year && m.month === month);
      // Si el mes actual no está en el array, por defecto usamos el primero (0)
      return idx === -1 ? 0 : idx;
    }

    // Selector de meses
    months.forEach((m, index) => {
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = m.name;
      monthSelect.appendChild(opt);
    });

    monthSelect.addEventListener("change", () => {
      const idx = parseInt(monthSelect.value, 10);
      subscribeToMonth(idx);
    });

    // Obtener días lectivos (con inicial del día: L, M, X, J, V)
    function getWeekdays(year, month) {
      const days = [];
      const date = new Date(year, month - 1, 1);
      const initials = {
        1: "L",
        2: "M",
        3: "X",
        4: "J",
        5: "V"
      };

      while (date.getMonth() === month - 1) {
        const day = date.getDay(); // 0=Dom, 1=Lun,...,6=Sab
        if (day >= 1 && day <= 5) {
          const d = String(date.getDate()).padStart(2, "0");
          const m = String(month).padStart(2, "0");
          const y = year;
          const initial = initials[day] || "";
          days.push({
            iso: `${y}-${m}-${d}`,
            label: `${initial} ${d}/${m}/${y}`
          });
        }
        date.setDate(date.getDate() + 1);
      }
      return days;
    }

    function renderMonth(monthIndex) {
      const { year, month } = months[monthIndex];
      const days = getWeekdays(year, month);
      const slotsForMonth = getSlotsForMonth(monthIndex);
      const saved = currentData || {};
      const todayIso = getTodayIso();

      calendarTable.innerHTML = "";

      // CABECERA (thead)
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      const labels = ["Fecha", "Sesión", ...classes];
      labels.forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      calendarTable.appendChild(thead);

      // CUERPO (tbody)
      const tbody = document.createElement("tbody");

      let todayAnchorRow = null; // para centrar el día actual

      days.forEach(day => {
        const isToday = (day.iso === todayIso);

        slotsForMonth.forEach((slot, slotIndex) => {
          const tr = document.createElement("tr");

          // Primera franja del día → separador grueso
          if (slotIndex === 0) {
            tr.classList.add("first-slot-of-day");
          }

          const tdFecha = document.createElement("td");
          tdFecha.textContent = day.label;
          if (isToday) {
            tdFecha.classList.add("today-date-cell");
          }
          tr.appendChild(tdFecha);

          const tdSlot = document.createElement("td");
          tdSlot.textContent = slot;
          tr.appendChild(tdSlot);

          // Para saber si esta franja (fila) tiene alguna reserva/bloqueo
          let rowHasReservation = false;

          // ¿Es franja bloqueada globalmente (martes 2ª, 3ª, 6ª)?
          const globalLabel = getGlobalBlockedLabel(day.iso, slot);

          classes.forEach(cls => {
            const td = document.createElement("td");

            if (globalLabel) {
              // Franja bloqueada completa: no reservable, rojo clarito, texto genérico
              td.classList.add("global-blocked");
              td.dataset.class = globalLabel;
              rowHasReservation = true;
            } else {
              td.classList.add("reservable");
              td.dataset.date = day.iso;
              td.dataset.slot = slot;
              td.dataset.class = cls; // usado para la marca de agua

              const id = buildReservationId(day.iso, slot, cls);
              const isFixed = isFixedReservation(day.iso, slot, cls);

              if (isFixed) {
                // reserva fija del horario → siempre ocupada y no clicable
                td.classList.add("fixed-reserved");
                td.dataset.fixed = "true";
                rowHasReservation = true;
              } else if (saved[id]) {
                td.classList.add("reserved");
                rowHasReservation = true;
              }
            }

            tr.appendChild(td);
          });

          // Si alguna celda de esta franja está reservada/bloqueada, coloreamos toda la fila
          if (rowHasReservation) {
            tr.classList.add("row-has-reservation");
          }

          // Guardamos la primera fila del día de hoy como ancla para centrar
          if (isToday && slotIndex === 0) {
            todayAnchorRow = tr;
          }

          tbody.appendChild(tr);
        });
      });

      calendarTable.appendChild(tbody);

      // Centrar automáticamente el día de hoy en pantalla (solo una vez por mes)
      if (todayAnchorRow && tableContainer) {
        const docId = `${year}-${String(month).padStart(2, "0")}`;
        if (!autoScrolledMonths[docId]) {
          const rowOffset = todayAnchorRow.offsetTop;
          const rowHeight = todayAnchorRow.offsetHeight;
          const targetScrollTop = rowOffset - (tableContainer.clientHeight / 2 - rowHeight / 2);
          tableContainer.scrollTop = Math.max(targetScrollTop, 0);
          autoScrolledMonths[docId] = true;
        }
      }
    }

    // 🧠 LÓGICA DE RESERVA / LIBERACIÓN CON DOBLE CLIC / DOBLE TOQUE
    const DOUBLE_CLICK_MS = 400;
    let lastCellId = null;
    let lastClickTime = 0;

    async function activarCelda(cell) {
      // Si es una reserva fija del horario, no hacemos nada
      if (cell.dataset.fixed === "true") {
        alert("Esta franja horaria está reservada de forma fija en el horario y no se puede modificar.");
        return;
      }

      // Las franjas global-blocked nunca son .reservable, así que no llegan aquí

      const { date, slot, class: className } = cell.dataset;
      const id = buildReservationId(date, slot, className);
      const fullId = buildFullReservationId(id);

      const value = currentData[id];   // puede ser undefined, true o timestamp (number)
      const now   = Date.now();

      // Si NO hay reserva en esta celda → queremos crear una nueva
      if (!value) {
        // ✅ NO permitir nuevas reservas en días ya pasados
        const todayIso = getTodayIso();
        if (date < todayIso) {
          alert("No se pueden hacer nuevas reservas en días que ya han pasado.");
          return;
        }

        // 1) Comprobar si el usuario YA tiene una reserva activa
        // en esta MISMA semana (ISO) en las últimas 24h
        const weekKey = getWeekKeyFromIso(date);
        let userInfo = getUserReservationInfoForWeek(weekKey);

        if (userInfo) {
          // Desglosamos la reserva guardada: docId::resId
          const [docId, resId] = userInfo.fullId.split("::");

          // Si la reserva guardada corresponde al documento (mes) actual,
          // comprobamos si REALMENTE sigue existiendo en Firestore
          if (docId === getCurrentDocId()) {
            const stillExists = currentData && currentData[resId];

            // Si ya no existe (alguien se la ha quitado), borramos la marca local de esa semana
            if (!stillExists) {
              removeUserReservationByFullId(userInfo.fullId);
              userInfo = null; // como si no tuviera reserva esa semana
            }
          }
        }

        // 2) Comprobar si la franja ya está ocupada por otra clase o por una reserva fija/bloqueada
        const existing = getExistingReservationForSlot(date, slot);
        if (existing) {
          const reservedClass = existing.className || "otra clase";
          alert(`No puedes reservar esta franja horaria porque ya está reservada por ${reservedClass}.`);
          return;
        }

        // 3) La franja está libre → crear reserva con timestamp (ms)
        await setReservationValue(id, now);

        // guardar la reserva del usuario en localStorage para ESA semana
        const newWeekKey = getWeekKeyFromIso(date);
        addUserReservationForWeek(newWeekKey, fullId, now);
        return;
      }

      // Si es un número, es un timestamp → comprobamos ventana de tiempo para DESHACER
      if (typeof value === "number") {
        const elapsed = now - value;
        if (elapsed <= UNRESERVE_WINDOW_MS) {
          await clearReservation(id);
          // si esta reserva era alguna de las guardadas del usuario, la eliminamos del mapa
          removeUserReservationByFullId(fullId);
        } else {
          alert("Esta reserva ya no se puede modificar.");
        }
        return;
      }

      // Compatibilidad con reservas antiguas (valor true): se permite borrar siempre
      if (value === true) {
        await clearReservation(id);
        removeUserReservationByFullId(fullId);
        return;
      }
    }

    calendarTable.addEventListener("click", (event) => {
      const cell = event.target.closest("td.reservable");
      if (!cell) return;

      const uniqueId = `${cell.dataset.date}__${cell.dataset.slot}__${cell.dataset.class}`;
      const now = Date.now();

      if (lastCellId === uniqueId && (now - lastClickTime) <= DOUBLE_CLICK_MS) {
        // Doble clic / doble toque → activar
        activarCelda(cell);
        lastCellId = null;
        lastClickTime = 0;
      } else {
        // Primer clic → solo marcar el tiempo
        lastCellId = uniqueId;
        lastClickTime = now;
      }
    });

    // Inicializar → seleccionar automáticamente el mes actual
    const initialIndex = getInitialMonthIndex();
    monthSelect.value = String(initialIndex);
    subscribeToMonth(initialIndex);
  </script>
</body>
</html>
